name: tests

# Runs ruff and the offline pytest suite on every push and pull request, so a change
# that breaks a guardrail (fence, refusal, citation checks) is caught before
# merge. No secrets and no network calls: the tests use stand-ins for the LLM
# and embedder. requirements-optional.txt is NOT installed (it pulls torch);
# the tests for those extras use stand-ins or skip when the package is absent.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # Same Python as the Dockerfile base image (python:3.12-slim).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check
      - run: python -m pytest -q
