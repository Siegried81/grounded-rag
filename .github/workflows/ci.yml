name: tests

# Runs the offline pytest suite on every push and pull request, so a change
# that breaks a guardrail (fence, refusal, citation checks) is caught before
# merge. No secrets and no network calls: the tests use stand-ins for the LLM
# and embedder. requirements-optional.txt is NOT installed (it pulls torch);
# the tests for those extras use stand-ins or skip when the package is absent.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same Python as the Dockerfile base image (python:3.12-slim).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
