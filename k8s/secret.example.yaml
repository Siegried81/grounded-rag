# Example Secret for grounded-rag. Holds what the .env file used to hold.
# Copy to secret.yaml, fill in real values, apply it BEFORE grounded-rag.yaml,
# and keep the real file out of git.
#
# Easiest path: build the Secret from your .env:
#   kubectl create secret generic rag-secrets --from-env-file=../.env
#
# Or edit and apply this file:
#   kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
type: Opaque
stringData:
  GROQ_API_KEY: "replace-me"
  OPENROUTER_API_KEY: "replace-me"
  # add any other keys your .env defines, one per line
